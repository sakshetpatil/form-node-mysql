<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 30px;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .form-container h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }
        label {
            font-weight: bold;
            color: #333;
        }
        .form-control,
        .form-control-file {
            border-radius: 4px;
            box-shadow: none;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(38, 143, 255, 0.25);
        }
        .btn-custom {
            background-color: rgb(79, 79, 185);
            color: white;
            border-radius: 4px;
        }
        .btn-custom:hover {
            background-color: #5a5ac2;
        }
        .btn-reset {
            background-color: #6c757d;
            color: white;
            border-radius: 4px;
        }
        .btn-reset:hover {
            background-color: #5a6268;
        }
        .error-message {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <form id="Registration-form" action="/register" method="post" enctype="multipart/form-data" onsubmit="return validation() && validateDOB() && countCheckedHobbies()">
        <h1 style="text-align: center;">Student Register</h1>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="email">Email Id</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <fieldset class="form-group">
            <legend>Gender</legend>
            <div class="form-check">
                <input type="radio" id="male" name="gender" value="male" class="form-check-input" checked>
                <label for="male" class="form-check-label">Male</label>
            </div>
            <div class="form-check">
                <input type="radio" id="female" name="gender" value="female" class="form-check-input">
                <label for="female" class="form-check-label">Female</label>
            </div>
            <div class="form-check">
                <input type="radio" id="other" name="gender" value="other" class="form-check-input">
                <label for="other" class="form-check-label">Other</label>
            </div>
        </fieldset>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address" class="form-control" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile No.</label>
            <input type="tel" id="mobile" name="mobile" class="form-control" pattern="[0-9]{10}" required>
            <small class="form-text text-muted">format: 10 digit number without dash or space</small>
        </div>

        <div class="form-group">
            <label for="dob">DOB</label>
            <input type="date" id="dob" name="dob" class="form-control" required min="1996-01-01" max="2006-01-01" onchange="validateDOB()">
        </div>

        <div class="form-group">
            <label for="education">Education</label>
            <input list="education" name="education" class="form-control">
            <datalist id="education">
                <option value="BE/B.TEC.">Bachelor of Engineering</option>
                <option value="PG">Post Graduate</option>
                <option value="MSC">MSC(cs)</option>
            </datalist>
        </div>

        <div class="form-group">
            <label>Hobbies (2 to 4)</label>
            <div class="form-check">
                <input type="checkbox" id="hobbies1" name="hobbies[]" value="Swimming" class="form-check-input" onclick="countCheckedHobbies()">
                <label for="hobbies1" class="form-check-label">Swimming</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="hobbies2" name="hobbies[]" value="Photography" class="form-check-input" onclick="countCheckedHobbies()">
                <label for="hobbies2" class="form-check-label">Photography</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="hobbies3" name="hobbies[]" value="Calligraphy" class="form-check-input" onclick="countCheckedHobbies()">
                <label for="hobbies3" class="form-check-label">Calligraphy</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="hobbies4" name="hobbies[]" value="Parajumping" class="form-check-input" onclick="countCheckedHobbies()">
                <label for="hobbies4" class="form-check-label">Parajumping</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="hobbies5" name="hobbies[]" value="Reading" class="form-check-input" onclick="countCheckedHobbies()">
                <label for="hobbies5" class="form-check-label">Reading</label>
            </div>
            <div class="error-message" id="hobbies-error"></div>
        </div>

        <div class="form-group">
            <label for="photo">Photo</label>
            <input type="file" id="photo" name="photo" class="form-control-file" accept="image/png,image/jpeg,image/jpg" required>
        </div>

        <div class="form-group">
            <label for="resume">Resume</label>
            <input type="file" id="resume" name="resume" class="form-control-file" accept=".pdf,.doc,.docx" required>
        </div>

        <button type="submit" class="btn btn-custom">Register</button>
        <button type="reset" class="btn btn-reset">Clear</button>
    </form>
</div>

<script>
    function validation() {
        var passwordinput = document.getElementById('password').value;
        var confirmpasswordinput = document.getElementById("confirm-password").value;
        if (passwordinput !== confirmpasswordinput) {
            alert("Passwords do not match");
            document.getElementById("confirm-password").focus();
            return false;
        }

        const mobilePattern = /^[0-9]{10}$/;
        if (!mobilePattern.test(document.getElementById("mobile").value)) {
            alert("Mobile number must be 10 digits.");
            document.getElementById("mobile").focus();
            return false;
        }

        return true;
    }

    function validateDOB() {
        const dobInput = document.getElementById("dob");
        const dob = new Date(dobInput.value);
        const today = new Date();
        
        const age = today.getFullYear() - dob.getFullYear();
        const monthDiff = today.getMonth() - dob.getMonth();

        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
            age--;
        }

        if (age < 18 || age > 28) {
            alert("Age must be between 18 and 28 years.");
            dobInput.focus();
            return false;
        }

        return true;
    }

    function countCheckedHobbies() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"][name="hobbies[]"]');
        let checkedCount = 0;

        checkboxes.forEach(checkbox => {
            if (checkbox.checked) {
                checkedCount++;
            }
        });

        const errorElement = document.getElementById('hobbies-error');
        if (checkedCount < 2 || checkedCount > 4) {
            errorElement.textContent = "Please select between 2 to 4 hobbies.";
        } else {
            errorElement.textContent = "";
        }
    }
</script>
</body>
</html>
